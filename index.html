<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#281060">
<title>Flick Frenzy</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#201050;color:white;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;user-select:none;
  -webkit-user-select:none;
}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{
  position:absolute;
  top:calc(env(safe-area-inset-top) + 15px);
  left:0;width:100%;
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;padding:0 14px;
  pointer-events:none;
}
.stat{
  background:rgba(30,12,80,.65);
  border:1px solid rgba(255,255,255,.25);
  border-radius:13px;
  padding:9px;text-align:center;
  font-size:15px;font-weight:bold;
}
#message{
  position:absolute;top:24%;left:0;
  width:100%;text-align:center;
  font-size:27px;font-weight:900;
  text-shadow:0 3px 12px #150530;
  pointer-events:none;
}
#hint{
  position:absolute;bottom:8%;
  width:100%;text-align:center;
  font-size:16px;color:#e5e3ff;
  pointer-events:none;
}
#again{
  display:none;position:absolute;
  top:58%;left:50%;transform:translateX(-50%);
  border:0;border-radius:16px;
  background:#ffdf44;color:#24104d;
  font-size:20px;font-weight:900;
  padding:17px 32px;
  box-shadow:0 7px 0 #c99d14;
  white-space:nowrap;
}
</style>
</head>
<body>

<div id="hud">
  <div class="stat" id="score">Score: 0</div>
  <div class="stat" id="miss">Misses: 0/3</div>
  <div class="stat" id="combo">Combo: 0x</div>
  <div class="stat" id="coins">Coins: 0</div>
  <div class="stat" id="best">Best: 0</div>
  <div class="stat" id="wind">Wind: 0</div>
</div>

<div id="message">FLICK FRENZY</div>
<div id="hint">Swipe up to throw!</div>
<button id="again">PLAY AGAIN</button>
<canvas id="game"></canvas>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const missEl=document.getElementById("miss");
const comboEl=document.getElementById("combo");
const coinsEl=document.getElementById("coins");
const bestEl=document.getElementById("best");
const windEl=document.getElementById("wind");
const message=document.getElementById("message");
const hint=document.getElementById("hint");
const again=document.getElementById("again");

let W=0,H=0;
let score=0,misses=0,combo=0;
let coins=0,best=0;
let ball=null,start=null;
let over=false,locked=false;
let targetOffset=0;
let wind=0;
let shotStart=0;
let messageTimer=null;

try{
  coins=Number(localStorage.getItem("ff_coins"))||0;
  best=Number(localStorage.getItem("ff_best"))||0;
}catch(e){}

function save(){
  try{
    localStorage.setItem("ff_coins",coins);
    localStorage.setItem("ff_best",best);
  }catch(e){}
}

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
}
window.addEventListener("resize",resize);
resize();

function updateHUD(){
  scoreEl.textContent="Score: "+score;
  missEl.textContent="Misses: "+misses+"/3";
  comboEl.textContent="Combo: "+combo+"x";
  coinsEl.textContent="Coins: "+coins;
  bestEl.textContent="Best: "+best;
  windEl.textContent="Wind: "+wind.toFixed(1);
}

function showMessage(text,duration=0){
  clearTimeout(messageTimer);
  message.textContent=text;
  if(duration>0){
    messageTimer=setTimeout(()=>{
      if(!over)message.textContent="";
    },duration);
  }
}

function target(){
  return{
    x:W/2+targetOffset,
    y:H*.38,
    r:Math.min(W*.16,75)
  };
}

function newWind(){
  wind=(Math.random()-.5)*.12;
}

function reset(){
  clearTimeout(messageTimer);
  score=0;
  misses=0;
  combo=0;
  ball=null;
  start=null;
  locked=false;
  over=false;
  targetOffset=0;
  newWind();
  again.style.display="none";
  hint.textContent="Swipe up to throw!";
  showMessage("FLICK FRENZY",1400);
  updateHUD();
}

function finish(hit,perfect=false){
  if(!ball||ball.done)return;

  ball.done=true;
  locked=true;

  if(hit){
    combo++;
    const multiplier=Math.min(combo,3);
    const gained=10*multiplier+(perfect?20:0);
    const earned=5+(perfect?5:0);

    score+=gained;
    coins+=earned;

    if(score>best)best=score;

    showMessage(
      perfect?"PERFECT! +"+gained:
      "NICE SHOT! +"+gained
    );

    targetOffset=(Math.random()-.5)*W*.35;
    newWind();
    save();
  }else{
    misses++;
    combo=0;
    showMessage("MISSED!");
  }

  updateHUD();

  setTimeout(()=>{
    ball=null;
    if(misses>=3){
      over=true;
      showMessage("GAME OVER! Score: "+score);
      hint.textContent="Try to beat your best!";
      again.style.display="block";
    }else{
      locked=false;
      showMessage("SWIPE TO THROW",1100);
    }
  },750);
}

canvas.addEventListener("pointerdown",e=>{
  if(over||locked||ball)return;
  start={x:e.clientX,y:e.clientY};
});

canvas.addEventListener("pointerup",e=>{
  if(!start||over||locked||ball)return;

  const dx=e.clientX-start.x;
  const dy=e.clientY-start.y;
  start=null;

  if(dy>=-20)return;

  // Faster throwing physics from version 0.1
  const power=Math.min(
    2,Math.max(.8,-dy/(H*.2))
  );

  ball={
    x:W/2,
    y:H*.82,
    vx:dx*.025,
    vy:-Math.max(12,H*.020)*power,
    r:25,
    done:false
  };

  shotStart=performance.now();
  showMessage("");
});

canvas.addEventListener("pointercancel",()=>{
  start=null;
});

again.addEventListener("click",reset);

function draw(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#321080");
  bg.addColorStop(.6,"#6731b7");
  bg.addColorStop(1,"#08c9db");

  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  // Arcade floor
  ctx.fillStyle="#341478";
  ctx.beginPath();
  ctx.moveTo(0,H*.70);
  ctx.lineTo(W,H*.70);
  ctx.lineTo(W,H);
  ctx.lineTo(0,H);
  ctx.fill();

  // Decorative neon floor lines
  ctx.strokeStyle="rgba(97,250,255,.3)";
  ctx.lineWidth=2;
  for(let i=0;i<5;i++){
    const x=W*i/4;
    ctx.beginPath();
    ctx.moveTo(W/2,H*.70);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  const t=target();

  // Glowing target
  ctx.save();
  ctx.shadowBlur=25;
  ctx.shadowColor="#ffdf33";
  ctx.fillStyle="#ffdf33";
  ctx.beginPath();
  ctx.ellipse(t.x,t.y,t.r,t.r*.5,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle="#30105e";
  ctx.beginPath();
  ctx.ellipse(t.x,t.y,t.r*.7,t.r*.3,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#ff9ef5";
  ctx.beginPath();
  ctx.arc(t.x,t.y,5,0,Math.PI*2);
  ctx.fill();

  // Update ball
  if(ball&&!ball.done){
    ball.x+=ball.vx;
    ball.y+=ball.vy;
    ball.vx+=wind;
    ball.vy+=.20;

    // Check target crossing on descent
    if(ball.vy>0&&
       Math.abs(ball.y-t.y)<Math.max(7,ball.vy)&&
       Math.abs(ball.x-t.x)<t.r*.7){

      const distance=Math.abs(ball.x-t.x);
      const perfect=distance<t.r*.22;
      finish(true,perfect);
    }

    // Reliable missed-shot detection
    if(!ball.done&&(
      ball.y>H+50||
      ball.x< -80||
      ball.x>W+80||
      performance.now()-shotStart>4500
    )){
      finish(false);
    }
  }

  const b=ball||(!over?{
    x:W/2,y:H*.82,r:25
  }:null);

  if(b){
    ctx.save();
    ctx.fillStyle="#73faff";
    ctx.shadowColor="#73faff";
    ctx.shadowBlur=20;
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="rgba(255,255,255,.6)";
    ctx.beginPath();
    ctx.arc(b.x-7,b.y-7,7,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(draw);
}

newWind();
updateHUD();
draw();
</script>
</body>
</html>
