<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Flick Frenzy</title>
<style>
body{margin:0;overflow:hidden;background:#201050;color:white;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:absolute;top:35px;width:100%;display:flex;justify-content:space-around;font-weight:bold;font-size:20px}
#msg{position:absolute;top:18%;width:100%;text-align:center;font-size:25px;font-weight:bold}
button{position:absolute;top:60%;left:50%;transform:translateX(-50%);padding:16px 30px;border:0;border-radius:15px;background:#ffdf44;font-size:20px;font-weight:bold;display:none}
</style>
</head>
<body>
<div id="hud"><span id="score">Score: 0</span><span id="miss">Misses: 0/3</span></div>
<div id="msg">FLICK FRENZY</div>
<button id="again">Play Again</button>
<canvas id="game"></canvas>
<script>
const c=document.getElementById("game"),g=c.getContext("2d");
const s=document.getElementById("score"),m=document.getElementById("miss"),msg=document.getElementById("msg"),btn=document.getElementById("again");
let W,H,score=0,miss=0,ball=null,start=null,over=false,tx=0;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
onresize=resize;resize();
function target(){return{x:W/2+tx,y:H*.38,r:W*.16}}
c.onpointerdown=e=>{start={x:e.clientX,y:e.clientY}};
c.onpointerup=e=>{
if(!start||ball||over)return;
let dx=e.clientX-start.x,dy=e.clientY-start.y;
start=null;
if(dy>=-20)return;
ball={x:W/2,y:H*.82,vx:dx*.018,vy:-Math.max(7,H*.012)*Math.min(1.7,Math.max(.6,-dy/(H*.3))),r:25,done:false};
msg.textContent="";
};
function finish(hit){
if(!ball||ball.done)return;
ball.done=true;
if(hit){score+=10;msg.textContent="NICE SHOT!";tx=(Math.random()-.5)*W*.3}
else{miss++;msg.textContent="MISSED!"}
s.textContent="Score: "+score;
m.textContent="Misses: "+miss+"/3";
setTimeout(()=>{
ball=null;
if(miss>=3){over=true;msg.textContent="GAME OVER";btn.style.display="block"}
else msg.textContent="";
},650);
}
btn.onclick=()=>{score=miss=tx=0;ball=null;over=false;btn.style.display="none";msg.textContent="FLICK FRENZY";s.textContent="Score: 0";m.textContent="Misses: 0/3"};
function draw(){
let bg=g.createLinearGradient(0,0,0,H);
bg.addColorStop(0,"#321080");bg.addColorStop(1,"#08c9db");
g.fillStyle=bg;g.fillRect(0,0,W,H);
g.fillStyle="#3b167c";
g.fillRect(0,H*.7,W,H*.3);
let t=target();
g.shadowBlur=25;g.shadowColor="#ffdf33";
g.fillStyle="#ffdf33";
g.beginPath();g.ellipse(t.x,t.y,t.r,t.r*.5,0,0,7);g.fill();
g.shadowBlur=0;
g.fillStyle="#30105e";
g.beginPath();g.ellipse(t.x,t.y,t.r*.7,t.r*.3,0,0,7);g.fill();
if(ball){
if(!ball.done){
ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=.26;
if(ball.vy>0&&Math.abs(ball.x-t.x)<t.r*.7&&Math.abs(ball.y-t.y)<t.r*.3)finish(true);
if(ball.y>H+40||ball.x< -50||ball.x>W+50)finish(false);
}
}
let b=ball||(!over?{x:W/2,y:H*.82,r:25}:null);
if(b){g.fillStyle="#73faff";g.shadowColor="#73faff";g.shadowBlur=20;g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill();g.shadowBlur=0}
requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
