function shufflePalette(){
let n;
do{n=Math.floor(Math.random()*palettes.length);}
while(n===paletteIndex);

const p=palettes[n];
for(const k in M)M[k].color.set(p[k]);

scene.fog.color.set(p.back);
}

// GEOMETRY

function mesh(g,m,x=0,y=0,z=0,parent=scene){
const o=new THREE.Mesh(g,m);
o.position.set(x,y,z);
o.castShadow=true;
o.receiveShadow=true;
parent.add(o);
return o;
}

function box(w,h,d,m,x,y,z,parent=scene){
return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z,parent);
}

function sphere(r,m,x,y,z,parent=scene){
return mesh(new THREE.SphereGeometry(r,20,14),m,x,y,z,parent);
}

function cyl(rt,rb,h,m,x,y,z,parent=scene,open=false){
return mesh(new THREE.CylinderGeometry(rt,rb,h,24,1,open),m,x,y,z,parent);
}

function tube(a,b,r,m,parent=scene){
const v=b.clone().sub(a);
const mid=a.clone().add(b).multiplyScalar(.5);
const o=mesh(new THREE.CylinderGeometry(r,r,v.length(),10),
m,mid.x,mid.y,mid.z,parent);
o.quaternion.setFromUnitVectors(V(0,1,0),v.normalize());
return o;
}

const obstacles=[];

function collisionBox(w,h,d,x,y,z,restitution=.7,type="object",angle=0){
obstacles.push({
c:V(x,y,z),
h:V(w/2,h/2,d/2),
e:restitution,
type,
angle,
cos:Math.cos(angle),
sin:Math.sin(angle)
});
}

function solid(w,h,d,m,x,y,z,restitution=.7,type="object",angle=0){
const o=box(w,h,d,m,x,y,z);
o.rotation.y=angle;
collisionBox(w,h,d,x,y,z,restitution,type,angle);
return o;
}

function graphic(w,h,draw){
const c=document.createElement("canvas");
c.width=w;
c.height=h;
const ctx=c.getContext("2d");
draw(ctx,w,h);
const t=new THREE.CanvasTexture(c);
t.colorSpace=THREE.SRGBColorSpace;
t.anisotropy=4;
return new THREE.MeshBasicMaterial({
map:t,side:THREE.DoubleSide
});
}

function textPanel(lines,bg,fg,w=512,h=512){
return graphic(w,h,(c,W,H)=>{
c.fillStyle=bg;
c.fillRect(0,0,W,H);

c.textAlign="center";
c.textBaseline="middle";
const size=Math.min(70,Math.floor(
W/(Math.max(...lines.map(s=>s.length))*.62)
));
c.font="bold "+size+"px Arial";
lines.forEach((s,i)=>{
c.fillText(s,W/2,H*(i+1)/(lines.length+1));
});
});
}

// DESK

const DESK_TOP=.835;
const deskShape=new THREE.Shape();

deskShape.lineTo(2.19,.12);

deskShape.quadraticCurveTo(-1.78,.26,-1.78,.12);
deskShape.closePath();

const deskGeometry=new THREE.ExtrudeGeometry(deskShape,{
depth:.075,
bevelEnabled:true,
bevelSegments:3,
steps:1,
bevelSize:.025,
bevelThickness:.022,
curveSegments:12
});

deskGeometry.rotateX(Math.PI/2);
mesh(deskGeometry,M.desk,0,.81,0);

const deskPolygon=deskShape.getPoints(24).map(p=>({
x:p.x,z:p.y
}));

function pointInsideDesk(x,z){
let inside=false;
for(let i=0,j=deskPolygon.length-1;i<deskPolygon.length;j=i++){
const a=deskPolygon[i],b=deskPolygon[j];
if(
((a.z>z)!==(b.z>z))&&
x<(b.x-a.x)*(z-a.z)/(b.z-a.z)+a.x
)inside=!inside;
}
return inside;
}

function nearestDeskEdge(x,z){
let best=Infinity,px=0,pz=0;
for(let i=0;i<deskPolygon.length;i++){
const a=deskPolygon[i];
const b=deskPolygon[(i+1)%deskPolygon.length];
const vx=b.x-a.x,vz=b.z-a.z;
const len=vx*vx+vz*vz;
const t=len>0?clamp(
((x-a.x)*vx+(z-a.z)*vz)/len,0,1
):0;
const ex=a.x+vx*t,ez=a.z+vz*t;
const d=(x-ex)**2+(z-ez)**2;
if(d<best){best=d;px=ex;pz=ez;}
}
return{distance:Math.sqrt(best),x:px,z:pz};
}

function collideDesk(s,previous){
const p=s.p;
const inside=pointInsideDesk(p.x,p.z);
const edge=nearestDeskEdge(p.x,p.z);
const aboveSurface=inside||edge.distance<R*.85;

if(
aboveSurface&&
previous.y>=DESK_TOP+R-.005&&
p.y<=DESK_TOP+R&&
s.v.y<0
){
p.y=DESK_TOP+R+.001;
rebound(s,V(0,1,0),PHYSICS.deskBounce,true,"desk");
return;
}

if(
aboveSurface&&
p.y>=DESK_TOP-R*.45&&
p.y<DESK_TOP+R&&
s.v.y<0

function beep(freq){

audio=audio||
new(window.AudioContext||window.webkitAudioContext)();

const o=audio.createOscillator();
const g=audio.createGain();

o.frequency.value=freq;
g.gain.setValueAtTime(.04,audio.currentTime);
g.gain.exponentialRampToValueAtTime(
.001,audio.currentTime+.13
);

o.connect(g);
g.connect(audio.destination);
o.start();
o.stop(audio.currentTime+.13);
}catch(e){}
}

function finish(hit,perfect=false){
if(!shot||shot.settled||screen!=="playing")return;

shot.settled=true;
shot.done=true;
locked=true;

if(hit){
successfulShots++;
combo++;

const bank=shot.banks>0;

const points=
10*Math.min(combo,3)+
(perfect?20:0)+
(bank?15:0);

score+=points;
coins+=5+(perfect?5:0);
best=Math.max(best,score);

if(bank)banks++;

if(mode==="challenge"){
const c=activeChallenge();
streak++;

if(c){
if(c.type==="streak")challengeCount=streak;
if(c.type==="hits")challengeCount++;
if(c.type==="banks"&&bank)challengeCount++;
if(c.type==="perfect"&&perfect)challengeCount++;
}
updateGoal();
}

if(shot.bankTypes.includes(BANK_COMPUTER)){
message("COMPUTER BANK! +"+points);
}else if(shot.bankTypes.includes(BANK_WALL)){
message("POSTER BANK! +"+points);
}else{
message(
bank?"LUCKY BANK! +"+points:
perfect?"PERFECT! +"+points:
"IN THE BIN! +"+points
);
}

beep(790);
save();

}else{
misses++;
combo=0;
streak=0;

if(
mode==="challenge"&&
activeChallenge()?.type==="streak"
){
challengeCount=0;
updateGoal();
}

message("MISSED!");
beep(230);
}

updateHUD();

mode==="challenge"&&
hit&&
challengeCount>=activeChallenge().need
){
completeChallenge();

}

}

// SWIPE CONTROLS

function swipeToPower(swipeDistance){
return clamp(
(swipeDistance/innerHeight-.02)/.20,
0,1
);
}

function launchVelocity(dx,dy){
const swipeDistance=Math.max(0,-dy);
const power=swipeToPower(swipeDistance);
const elevation=power;

const sideways=clamp(
dx/(innerWidth*.42),
-1.4,1.4
);

const forward=2.7+power*2.5;
const vertical=1.55+elevation*4.7;
const lateral=sideways*(2.8+power*1.9);

const velocity=FORWARD.clone()
.multiplyScalar(forward)
.addScaledVector(RIGHT,lateral);

velocity.y=vertical;

return{power,velocity};
}

// PHYSICS

function makeState(velocity){
return{
p:START.clone(),
v:velocity.clone(),
age:0,
banks:0,
contacts:0,
cooldown:0,
groundTime:0,
scored:false,
perfect:false,
done:false,
events:[],
lastImpact:0,
settled:false,
bankTypes:[]
};
}

function rebound(s,n,e,bank=true,type="object"){
const speed=s.v.dot(n);
if(speed>=-.01)return false;

const impact=-speed;
let bounce=e;

// Retain slightly more speed from bank surfaces.
if(
(
type==="wall"||
type==="computer"||
type===BANK_WALL||
type===BANK_COMPUTER
)&&impact>1.1
){
bounce=Math.min(.96,e+.025);
}

if(impact<.13){
bounce=Math.min(bounce,.3);
}

s.v.addScaledVector(n,-(1+bounce)*speed);

const normalSpeed=s.v.dot(n);
const tangent=s.v.clone().addScaledVector(n,-normalSpeed);

const friction=
type==="desk"?.965:
(type==="wall"||type===BANK_WALL)?.995:
(type==="computer"||type===BANK_COMPUTER)?.992:
.975;

s.v.copy(n.clone().multiplyScalar(normalSpeed));
s.v.addScaledVector(tangent,friction);

s.contacts++;
s.lastImpact=impact;

if(bank&&impact>PHYSICS.minimumBankSpeed){
s.banks++;

if(s.events.length<30){
s.events.push(s.p.clone());
}

if(!s.bankTypes.includes(type)){
s.bankTypes.push(type);
}
}

return true;
}

function collideRoom(s,dt){
const p=s.p;

if(p.x<-4.35+R){
p.x=-4.35+R;
rebound(s,V(1,0,0),PHYSICS.wallBounce,true,"wall");
}

if(p.x>4.35-R){
p.x=4.35-R;
rebound(s,V(-1,0,0),PHYSICS.wallBounce,true,"wall");
}

if(p.z<-5.35+R){
p.z=-5.35+R;
rebound(s,V(0,0,1),PHYSICS.wallBounce,true,"wall");
}

if(p.z>3.7-R){
p.z=3.7-R;
rebound(s,V(0,0,-1),PHYSICS.wallBounce,true,"wall");
}

if(p.y>3.8-R){
p.y=3.8-R;
rebound(s,V(0,-1,0),.7,true,"wall");
}

if(p.y<R){
p.y=R;

if(s.v.y<-.2){
rebound(s,V(0,1,0),PHYSICS.floorBounce,false,"floor");
s.v.x*=.94;
s.v.z*=.94;
}else{
s.v.y=0;
const drag=Math.exp(-2*dt);
s.v.x*=drag;
s.v.z*=drag;
}

s.groundTime+=Math.abs(s.v.y)<.5?dt:0;
}else{
s.groundTime=0;
}
}

function collideFurniture(s){
for(const b of obstacles){
const relative=s.p.clone().sub(b.c);

const local=V(
relative.x*b.cos-relative.z*b.sin,
relative.y,
relative.x*b.sin+relative.z*b.cos
);

const nearest=V(
clamp(local.x,-b.h.x,b.h.x),
clamp(local.y,-b.h.y,b.h.y),
clamp(local.z,-b.h.z,b.h.z)
);

const delta=local.clone().sub(nearest);
const d2=delta.lengthSq();

if(d2>=R*R)continue;

let normal,depth;

if(d2>1e-10){
const d=Math.sqrt(d2);
normal=delta.multiplyScalar(1/d);
depth=R-d;
}else{
const faces=[
{d:b.h.x-Math.abs(local.x),axis:0},
{d:b.h.y-Math.abs(local.y),axis:1},
{d:b.h.z-Math.abs(local.z),axis:2}
];

faces.sort((a,b)=>a.d-b.d);

normal=V(0,0,0);
const axis=faces[0].axis;

normal.setComponent(
axis,
Math.sign(local.getComponent(axis))||1
);

depth=R+faces[0].d;
}

const worldNormal=V(
normal.x*b.cos+normal.z*b.sin,
normal.y,
-normal.x*b.sin+normal.z*b.cos
).normalize();

s.p.addScaledVector(worldNormal,depth+.001);

rebound(s,worldNormal,b.e,true,b.type);
}
}

function collideBin(s,previous,cx){
const p=s.p;

const dx=p.x-cx;
const dz=p.z-BIN_Z;
const horizontal=Math.hypot(dx,dz);

if(
previous.y>=BIN_TOP&&
p.y<BIN_TOP&&
s.v.y<0
){
const t=clamp(
(previous.y-BIN_TOP)/(previous.y-p.y),
0,1
);

const x=previous.x+(p.x-previous.x)*t;
const z=previous.z+(p.z-previous.z)*t;

const dist=Math.hypot(x-cx,z-BIN_Z);
const opening=BIN_R-R+PHYSICS.scoreOpeningExtra;

if(dist<opening){
s.scored=true;
s.perfect=dist<BIN_R*.27;
s.done=true;
return;
}
}

const ringDistance=Math.hypot(
horizontal-BIN_R,
p.y-BIN_TOP
);

if(ringDistance<R+.02&&s.cooldown<=0){
const radial=V(
dx/(horizontal||1),
0,
dz/(horizontal||1)
);

const normal=V(
radial.x*(horizontal-BIN_R),
p.y-BIN_TOP,
radial.z*(horizontal-BIN_R)
).normalize();

if(normal.lengthSq()<.01){
normal.set(0,1,0);
}

const incoming=s.v.clone();

if(rebound(
s,normal,PHYSICS.rimBounce,false,"rim"
)){
p.addScaledVector(normal,.016);

if(
incoming.y<-.3&&
horizontal>BIN_R*.78&&
horizontal<BIN_R+R+.035
){
const inward=V(
cx-p.x,0,BIN_Z-p.z
).normalize();

s.v.addScaledVector(
inward,PHYSICS.rimInwardAssist
);
}

s.cooldown=.085;
}
}

if(
p.y>BIN_BASE+R&&
p.y<BIN_TOP-R*.3&&
Math.abs(horizontal-BIN_R)<R
){
const inside=horizontal<BIN_R;

const radial=V(
dx/(horizontal||1),
0,
dz/(horizontal||1)
);

const normal=inside?
radial.clone().negate():
radial;

p.x=cx+radial.x*(BIN_R+(inside?-R:R));
p.z=BIN_Z+radial.z*(BIN_R+(inside?-R:R));

rebound(s,normal,.58,false,"bin");
}

if(
p.y<BIN_BASE+R&&
p.y>BIN_BASE-R&&
horizontal<BIN_R-R
){
p.y=BIN_BASE+R;
rebound(s,V(0,1,0),.35,false,"bin");
}
}

function physicsStep(s,dt,cx){
if(s.done)return;

const previous=s.p.clone();

s.age+=dt;
s.cooldown=Math.max(0,s.cooldown-dt);

s.v.y-=G*dt;
s.p.addScaledVector(s.v,dt);

collideRoom(s,dt);
collideDesk(s,previous);
collideFurniture(s);
collideBin(s,previous,cx);

if(
s.age>5||
(s.age>1.2&&s.groundTime>.65)
){
s.done=true;
}
}

// V0.9.26: SHORTER, CLEANER TRAJECTORY PREVIEW

function drawGuide(dx,dy){
if(!guideOn){
hideGuide();
return;
}

const data=launchVelocity(dx,dy);
const sim=makeState(data.velocity);
const points=[sim.p.clone()];

let firstBounceAt=-1;

for(let i=0;i<1200;i++){
physicsStep(sim,1/240,targetGroup.position.x);

if(i%8===0){
points.push(sim.p.clone());
}

if(firstBounceAt<0&&sim.events.length){
firstBounceAt=i;
}

if(
sim.done||
i>=280||
(firstBounceAt>=0&&i-firstBounceAt>=80)
){
break;
}
}

for(let i=0;i<guideDots.length;i++){
const d=guideDots[i];
const idx=Math.round(i*2.3);

d.visible=idx<points.length;

if(d.visible){
d.position.copy(points[idx]);
}
}

dotMaterial.color.set("#ffe4a2");

for(let i=0;i<bounceDots.length;i++){
const d=bounceDots[i];
d.visible=i<sim.events.length;

if(d.visible){
d.position.copy(sim.events[i]);
}
}

$("aim").textContent=sim.events.length?
"REBOUND PREVIEW":"SWIPE TO AIM";
}

function launch(dx,dy){
const data=launchVelocity(dx,dy);

shot=makeState(data.velocity);
ball.position.copy(START);
ball.visible=true;
viewModel.visible=false;

hideGuide();

trailPoints=[];
trail.visible=effectsOn;

$("power").textContent=
"POWER: "+Math.round(data.power*100)+"%";

message("");
beep(470);
}

// TOUCH CONTROLS

const canvas=$("game");

canvas.addEventListener("pointerdown",e=>{
if(
screen!=="playing"||
over||locked||shot
)return;

touch={
x:e.clientX,
y:e.clientY
};

try{
canvas.setPointerCapture(e.pointerId);
}catch(err){}
});

canvas.addEventListener("pointermove",e=>{
if(!touch||screen!=="playing"||shot)return;

const dx=e.clientX-touch.x;
const dy=e.clientY-touch.y;

if(dy>=-15){
hideGuide();
return;
}

drawGuide(dx,dy);

$("power").textContent=
"POWER: "+
Math.round(swipeToPower(-dy)*100)+"%";
});

canvas.addEventListener("pointerup",e=>{
if(
!touch||
screen!=="playing"||
locked||shot
)return;

const dx=e.clientX-touch.x;
const dy=e.clientY-touch.y;

touch=null;
hideGuide();

if(dy>=-20)return;

launch(dx,dy);
});

canvas.addEventListener("pointercancel",()=>{
touch=null;
hideGuide();
});

// BALL FLIGHT

function updateBall(dt){
if(!shot||shot.done)return;

const before=shot.contacts;
const steps=Math.max(
1,Math.ceil(dt/(1/240))
);

for(let i=0;i<steps;i++){
physicsStep(
shot,
dt/steps,
targetGroup.position.x
);

if(shot.done)break;
}

ball.position.copy(shot.p);
ball.rotation.x+=shot.v.z*dt*.45;
ball.rotation.z-=shot.v.x*dt*.45;

ballLight.position.copy(ball.position);
ball.scale.set(1,1,1);

if(shot.contacts>before){
beep(shot.lastImpact>1.5?420:320);
}

if(effectsOn){
trailPoints.push(ball.position.clone());

if(trailPoints.length>13){
trailPoints.shift();
}

trail.geometry.dispose();
trail.geometry=
new THREE.BufferGeometry()
.setFromPoints(trailPoints);

trail.visible=trailPoints.length>1;
}

if(shot.done){
finish(shot.scored,shot.perfect);
}
}

function update(dt){
if(screen!=="playing")return;

targetPhase+=dt;

const c=activeChallenge();

targetGroup.position.x=
mode==="challenge"&&c?.moving?
BIN_X+Math.sin(targetPhase*1.25)*.08:
BIN_X;

if(mode==="challenge"&&!over){
updateGoal();

if(
c?.limit&&
(performance.now()-challengeStart)/1000>=c.limit
){
failChallenge("TIME UP!");
return;
}
}

if(!over)updateBall(dt);
}

// CHALLENGES

function renderChallenges(){
const list=$("challengeList");
list.innerHTML="";

$("progress").textContent=
"Completed "+
challenges.filter(c=>completed.includes(c.id)).length+
" / "+challenges.length;

for(const tier of ["Rookie","Skilled","Expert","Legend"]){
const heading=document.createElement("h3");
heading.textContent=tier;
list.appendChild(heading);

for(let i=0;i<challenges.length;i++){
const c=challenges[i];
if(c.tier!==tier)continue;

const unlocked=
i===0||
completed.includes(challenges[i-1].id);

const done=completed.includes(c.id);

const card=document.createElement("div");
card.className="item";

const name=document.createElement("strong");
name.textContent=
(done?"✓ ":unlocked?"🎯 ":"🔒 ")+c.name;

const desc=document.createElement("p");
desc.textContent=c.desc;

const reward=document.createElement("p");
reward.textContent=
c.reward+" coins"+
(c.limit?" · "+c.limit+" seconds":"")+
(c.moving?" · Moving target":"");

const btn=document.createElement("button");
btn.textContent=
done?"REPLAY":unlocked?"START":"LOCKED";

btn.disabled=!unlocked;
btn.onclick=()=>startGame("challenge",c.id);

card.append(name,desc,reward,btn);
list.appendChild(card);
}
}
}

// BALL SHOP

function renderShop(){
$("shopCoins").textContent="Coins: "+coins;

const list=$("skinList");
list.innerHTML="";

for(const s of skins){
const card=document.createElement("div");
card.className="item";

const preview=document.createElement("div");
preview.style.cssText=
"width:60px;height:60px;border-radius:50%;margin:8px auto;"+
"background:radial-gradient(circle at 30% 25%,white,"+
s.color+" 45%,"+s.glow+");";

const title=document.createElement("strong");
title.textContent=s.name;

const price=document.createElement("p");
price.textContent=
s.price?s.price+" coins":"Free";

const btn=document.createElement("button");

if(equipped===s.id){
btn.textContent="EQUIPPED";
btn.disabled=true;
}else if(owned.includes(s.id)){
btn.textContent="EQUIP";

btn.onclick=()=>{
equipped=s.id;
updateSkin();
save();
renderShop();
};

}else{
btn.textContent=
"BUY — "+s.price+" COINS";

btn.disabled=coins<s.price;

btn.onclick=()=>{
if(coins<s.price)return;

coins-=s.price;
owned.push(s.id);
equipped=s.id;

updateSkin();
save();
renderShop();
};
}

card.append(preview,title,price,btn);
list.appendChild(card);
}
}

function renderSettings(){
$("soundToggle").textContent=
soundOn?"ON":"OFF";

$("effectsToggle").textContent=
effectsOn?"ON":"OFF";

$("guideToggle").textContent=
guideOn?"ON":"OFF";
}

// BUTTONS

$("endlessBtn").onclick=()=>startGame("endless");

$("challengeBtn").onclick=()=>showScreen("challenges");
$("challengeBack").onclick=()=>showScreen("menu");

$("shopBtn").onclick=()=>showScreen("shop");
$("shopBack").onclick=()=>showScreen("menu");

$("settingsBtn").onclick=()=>showScreen("settings");
$("settingsBack").onclick=()=>showScreen("menu");

$("soundToggle").onclick=()=>{
soundOn=!soundOn;
save();
renderSettings();
};

$("effectsToggle").onclick=()=>{
effectsOn=!effectsOn;
save();
renderSettings();
};

$("guideToggle").onclick=()=>{
guideOn=!guideOn;
save();
renderSettings();
};

$("pause").onclick=()=>{
session++;

clearTimeout(finishTimer);
clearTimeout(messageTimer);

shot=null;
locked=false;
touch=null;

hideGuide();
showScreen("menu");
};

$("again").onclick=()=>{
if(
mode==="challenge"&&
completed.includes(challengeId)
){
showScreen("challenges");
}else{
startGame(mode,challengeId);
}
};

// MAIN LOOP

const clock=new THREE.Clock();

function frame(){
requestAnimationFrame(frame);

const dt=Math.min(
.04,clock.getDelta()
);

update(dt);
renderer.render(scene,camera);
}

resetBall();
updateHUD();
showScreen("menu");

$("loading").style.display="none";

frame();

</script>
