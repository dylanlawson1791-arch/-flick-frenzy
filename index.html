function mesh(g,m,x=0,y=0,z=0,parent=scene){

parent.add(o);

function texture(w,h,draw){
const c=document.createElement('canvas');
c.width=w;
c.height=h;
draw(c.getContext('2d'),w,h);
const t=new THREE.CanvasTexture(c);
t.colorSpace=THREE.SRGBColorSpace;
return new THREE.MeshBasicMaterial({map:t,side:THREE.DoubleSide});
}

const deskPoly=ds.getPoints(24).map(p=>({x:p.x,z:p.y}));

function insideDesk(x,z){
let inside=false;
for(let i=0,j=deskPoly.length-1;i<deskPoly.length;j=i++){
const a=deskPoly[i],b=deskPoly[j];
if((a.z>z)!==(b.z>z)){
if(x<(b.x-a.x)*(z-a.z)/(b.z-a.z)+a.x)inside=!inside;
}
}
return inside;
}

function deskEdge(x,z){
let best=Infinity,px=0,pz=0;
for(let i=0;i<deskPoly.length;i++){
const a=deskPoly[i],b=deskPoly[(i+1)%deskPoly.length];
const dx=b.x-a.x,dz=b.z-a.z,len=dx*dx+dz*dz;
const t=clamp(((x-a.x)*dx+(z-a.z)*dz)/(len||1),0,1);
const ex=a.x+dx*t,ez=a.z+dz*t;
const d=(x-ex)**2+(z-ez)**2;
if(d<best){best=d;px=ex;pz=ez}
}
return{d:Math.sqrt(best),x:px,z:pz};
}

function beep(freq){
if(!soundOn)return;
try{
audio=audio||new(window.AudioContext||window.webkitAudioContext)();
const o=audio.createOscillator();
const g=audio.createGain();
o.frequency.value=freq;
g.gain.setValueAtTime(.04,audio.currentTime);
g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.13);
o.connect(g);
g.connect(audio.destination);
o.start();
o.stop(audio.currentTime+.13);
}catch{}
}

/* CHALLENGE LOGIC */

const rank={none:0,bronze:1,silver:2,gold:3};

const medalIcon=m=>({
gold:'🥇',silver:'🥈',bronze:'🥉',none:'○'
}[m]||'○');

function completeChallenge(){
const c=activeChallenge();
if(!c)return;

if(!completed.includes(c[0])){
completed.push(c[0]);
coins+=c[6];
}

const earned=shotMisses===0?'gold':shotMisses===1?'silver':'bronze';
const old=medals[c[0]]||'none';

if(rank[earned]>rank[old]){
medals[c[0]]=earned;
coins+=({bronze:10,silver:25,gold:50})[earned];
}

save();
over=locked=true;
shot=null;
viewModel.visible=false;
hud();

message('COMPLETE! '+medalIcon(earned)+' '+earned.toUpperCase());
celebrate(true);
flash();
beep(950);

$('again').textContent='CHALLENGES';
$('again').style.display='block';
$('pause').style.display='none';
}

function failChallenge(t){
over=locked=true;
shot=null;
viewModel.visible=false;
message(t);
$('again').textContent='TRY AGAIN';
$('again').style.display='block';
$('pause').style.display='none';
}

function finish(hit,perfect=false){
if(!shot||shot.settled||screen!=='playing')return;

shot.settled=true;
locked=true;

const special=shot.types.includes(B1)||shot.types.includes(B2);
const bank=shot.banks>0;

if(hit){
successes++;
combo++;

const points=
10*Math.min(combo,3)+(perfect?20:0)+(bank?15:0);
score+=points;

if(mode!=='practice'){
coins+=5+(perfect?5:0);
best=Math.max(best,score);
}

if(bank)banks++;

if(mode==='challenge'){
const c=activeChallenge();
streak++;
if(c){
if(c[4]==='streak')challengeCount=streak;
if(c[4]==='hits')challengeCount++;
if(c[4]==='banks'&&bank)challengeCount++;
if(c[4]==='perfect'&&perfect)challengeCount++;
}
goal();
}

message(
special
?(shot.types.includes(B1)?'COMPUTER BANK! ':'POSTER BANK! ')+'+'+points
:bank?'BANK SHOT! +'+points
:perfect?'PERFECT! +'+points
:'IN THE BIN! +'+points
);

beep(perfect?960:790);
celebrate(perfect||combo>=3);
flash();
save();

}else{
misses++;
shotMisses++;
combo=streak=0;

if(mode==='challenge'&&activeChallenge()?.[4]==='streak'){
challengeCount=0;
goal();
}

message('MISSED!');
beep(230);
}

hud();

if(mode==='challenge'&&hit&&challengeCount>=activeChallenge()[5]){
completeChallenge();
return;
}

const s=session;

finishTimer=setTimeout(()=>{
if(s!==session||screen!=='playing')return;

if(mode!=='practice'&&misses>=3){
over=true;
viewModel.visible=false;
message('GAME OVER! '+score+' POINTS');
$('again').textContent='TRY AGAIN';
$('again').style.display='block';
$('pause').style.display='none';
return;
}

locked=false;

if(mode==='endless'&&hit&&successes%3===0){
round++;
shuffle();
label();
message('ROUND '+round,1000);
}else{
message('SHOOT AGAIN!',500);
}

resetBall();
},1050);
}

/* MANUAL AIMING */

const THROW_SPEED=6.6;

function precisionCurve(v){
const a=Math.abs(v);
return Math.sign(v)*(.85*a+.15*a*a);
}

function aimFromDrag(dx,dy){
const yaw=precisionCurve(
dx/Math.max(150,innerWidth*.62)*.85
)*Math.PI;

const elevation=clamp(
.42+precisionCurve(
-dy/Math.max(180,innerHeight*.48)*.85
)*1.10,
.025,1.49
);

return{yaw,elevation};
}

function velocity(aim,speed){
const baseline=V(
BIN_X-START.x,0,BIN_Z-START.z
).normalize();

const sideways=V(-baseline.z,0,baseline.x);

const horizontal=baseline
.multiplyScalar(Math.cos(aim.yaw))
.addScaledVector(sideways,Math.sin(aim.yaw))
.normalize();

const v=horizontal.multiplyScalar(
Math.cos(aim.elevation)*speed
);

v.y=Math.sin(aim.elevation)*speed;
return v;
}

/* PHYSICS */

function makeState(v){
return{
p:START.clone(),
v:v.clone(),
age:0,
steps:0,
banks:0,
contacts:0,
cooldown:0,
ground:0,
scored:false,
perfect:false,
done:false,
settled:false,
events:[],
types:[],
lastImpact:0
};
}

function rebound(s,n,e,bank=true,type='object'){
const dot=s.v.dot(n);
if(dot>=-.01)return false;

const force=-dot;

s.v.addScaledVector(
n,-(1+(force<.13?Math.min(e,.3):e))*dot
);

const normalSpeed=s.v.dot(n);
const tangent=s.v.clone().addScaledVector(n,-normalSpeed);

const friction=type==='desk'
?.965
:type===B1||type===B2
?.99
:.975;

s.v.copy(
n.clone().multiplyScalar(normalSpeed)
).addScaledVector(tangent,friction);

s.contacts++;
s.lastImpact=force;

if(s.events.length<40){
s.events.push({
p:s.p.clone(),
contact:s.p.clone().addScaledVector(n,-R),
n:n.clone(),
type,
step:s.steps,
impact:force
});
}

if(bank&&force>.45){
s.banks++;
if(!s.types.includes(type))s.types.push(type);
}

return true;
}

function boxContact(s,b){
const p=s.p.clone().sub(b.c).applyQuaternion(b.inv);

const near=V(
clamp(p.x,-b.h.x,b.h.x),
clamp(p.y,-b.h.y,b.h.y),
clamp(p.z,-b.h.z,b.h.z)
);

const delta=p.clone().sub(near);
const d2=delta.lengthSq();
if(d2>=R*R)return null;

let n,depth;

if(d2>1e-10){
const d=Math.sqrt(d2);
n=delta.multiplyScalar(1/d);
depth=R-d;
}else{
const faces=[
{d:b.h.x-Math.abs(p.x),axis:0},
{d:b.h.y-Math.abs(p.y),axis:1},
{d:b.h.z-Math.abs(p.z),axis:2}
].sort((a,b)=>a.d-b.d);

n=V(0,0,0);
n.setComponent(
faces[0].axis,
Math.sign(p.getComponent(faces[0].axis))||1
);
depth=R+faces[0].d;
}

n.applyQuaternion(b.q).normalize();
if(s.v.dot(n)>=-.01)return null;

return{
depth,n,e:b.e,type:b.type,
priority:b.type===B1||b.type===B2?5:1
};
}

function wallContacts(s){
const p=s.p,hits=[];

function add(d,n){
if(d>0&&s.v.dot(n)<-.01){
hits.push({
depth:d,n,e:.91,type:'wall',priority:0
});
}
}

if(p.y<2.55&&p.z>-2.55&&p.z<1.45){
add(-2.17+R-p.x,V(1,0,0));
add(p.x-(2.17-R),V(-1,0,0));
}

if(p.y<2.55&&Math.abs(p.x)<2.2){
add(-2.50+R-p.z,V(0,0,1));
}

add(-4.35+R-p.x,V(1,0,0));
add(p.x-(4.35-R),V(-1,0,0));
add(-5.35+R-p.z,V(0,0,1));
add(p.z-(3.7-R),V(0,0,-1));
add(p.y-(3.8-R),V(0,-1,0));

return hits;
}

function deskContact(s,previous){
const p=s.p;
const inside=insideDesk(p.x,p.z);
const edge=deskEdge(p.x,p.z);
const above=inside||edge.d<R*.85;

if(
above&&s.v.y<0&&
(
(previous.y>=DESK+R-.005&&p.y<=DESK+R)||
(p.y>=DESK-R*.45&&p.y<DESK+R)
)
){
return{
depth:DESK+R-p.y+.001,
n:V(0,1,0),
e:.7,type:'desk',priority:2
};
}

if(!inside&&edge.d<R&&p.y>DESK-.09&&p.y<DESK+R*.6){
const dx=p.x-edge.x,dz=p.z-edge.z;
const l=Math.hypot(dx,dz)||1;
const n=V(dx/l,0,dz/l);

if(s.v.dot(n)<-.01){
return{
depth:R-edge.d+.001,
n,e:.7,type:'desk',priority:2
};
}
}

return null;
}

function resolveWorld(s,previous){
const hits=wallContacts(s);
const desk=deskContact(s,previous);
if(desk)hits.push(desk);

for(const b of obstacles){
const c=boxContact(s,b);
if(c)hits.push(c);
}

if(hits.length){
hits.sort((a,b)=>
Math.abs(b.depth-a.depth)<.035
?b.priority-a.priority
:b.depth-a.depth
);

const c=hits[0];
s.p.addScaledVector(c.n,c.depth+.001);
rebound(s,c.n,c.e,true,c.type);
}

if(s.p.y<R){
s.p.y=R;

if(s.v.y<-.2){
rebound(s,V(0,1,0),.57,false,'floor');
s.v.x*=.94;
s.v.z*=.94;
}else{
s.v.y=0;
const drag=Math.exp(-2*DT);
s.v.x*=drag;
s.v.z*=drag;
}

s.ground+=Math.abs(s.v.y)<.5?DT:0;
}else{
s.ground=0;
}
}

function targetX(phase){
return mode==='challenge'&&activeChallenge()?.[7]
?BIN_X+Math.sin(phase*1.25)*.08
:BIN_X;
}

function collideBin(s,prev,cx){
const p=s.p;
const dx=p.x-cx,dz=p.z-BIN_Z;
const h=Math.hypot(dx,dz);

if(prev.y>=BIN_TOP&&p.y<BIN_TOP&&s.v.y<0){
const t=clamp(
(prev.y-BIN_TOP)/(prev.y-p.y),
0,1
);

const x=prev.x+(p.x-prev.x)*t;
const z=prev.z+(p.z-prev.z)*t;
const d=Math.hypot(x-cx,z-BIN_Z);

if(d<BIN_R-R+.025){
s.scored=true;
s.perfect=d<BIN_R*.27;
s.done=true;
return;
}
}

const ring=Math.hypot(h-BIN_R,p.y-BIN_TOP);

if(ring<R+.02&&s.cooldown<=0){
const radial=V(dx/(h||1),0,dz/(h||1));
const n=V(
radial.x*(h-BIN_R),
p.y-BIN_TOP,
radial.z*(h-BIN_R)
).normalize();

if(n.lengthSq()<.01)n.set(0,1,0);

if(rebound(s,n,.55,false,'rim')){
p.addScaledVector(n,.016);
s.cooldown=.085;
}
}

if(
p.y>BIN_BASE+R&&
p.y<BIN_TOP-R*.3&&
Math.abs(h-BIN_R)<R
){
const inside=h<BIN_R;
const radial=V(dx/(h||1),0,dz/(h||1));
const n=inside?radial.clone().negate():radial;

p.x=cx+radial.x*(BIN_R+(inside?-R:R));
p.z=BIN_Z+radial.z*(BIN_R+(inside?-R:R));

rebound(s,n,.58,false,'bin');
}
}

function step(s,cx){
if(s.done)return;

const previous=s.p.clone();
s.steps++;
s.age+=DT;
s.cooldown=Math.max(0,s.cooldown-DT);
s.v.y-=G*DT;
s.p.addScaledVector(s.v,DT);

collideBin(s,previous,cx);
if(s.done)return;

resolveWorld(s,previous);

if(s.age>=5||(s.age>1.2&&s.ground>.65)){
s.done=true;
}
}

function simulate(v,phase){
const s=makeState(v);
const samples=[{p:s.p.clone(),step:0}];

for(let i=0;i<1200;i++){
step(s,targetX(phase+(i+1)*DT));
samples.push({
p:s.p.clone(),step:s.steps
});
if(s.done)break;
}

return{s,samples};
}

/* REBOUND GUIDE — SHARED PHYSICS */

function drawGuide(v){
if(!guideOn){
hideGuide();
return;
}

const {s,samples}=simulate(v,targetPhase);
const first=s.events[0];
const second=s.events[1];
const split=first?first.step:Infinity;

const end=first
?Math.min(
s.steps,
first.step+Math.ceil(.9/DT),
second?second.step:Infinity
)
:Math.min(s.steps,Math.ceil(1.7/DT));

const before=[];
const after=[];

for(const a of samples){
if(a.step>end)break;
if(a.step<split)before.push(a.p);
if(first&&a.step>=split)after.push(a.p);
}

if(first){
const centre=samples.find(a=>a.step===split)?.p;
if(centre)before.push(centre.clone());
}

setLine(guides[0],before);
setLine(guides[1],after);

impact.visible=!!first;
if(first)impact.position.copy(first.contact);

$('aim').textContent=first
?'YELLOW: FLIGHT · BLUE: ACTUAL REBOUND'
:'YELLOW: FLIGHT PATH';
}

/* HOLD, DRAG, RELEASE */

function launch(v){
shot=makeState(v);
shot.phase=targetPhase;
shot.lastContact=0;
acc=0;

ball.position.copy(START);
ball.visible=true;
viewModel.visible=false;

hideGuide();
trailPoints=[];
trail.visible=effectsOn;
message('');
beep(470);
}

const canvas=$('game');

function previewAim(t){
const a=aimFromDrag(
t.x-t.startX,
t.y-t.startY
);
t.velocity=velocity(a,THROW_SPEED);
drawGuide(t.velocity);
}

canvas.addEventListener('pointerdown',e=>{
if(screen!=='playing'||over||locked||shot)return;

touch={
id:e.pointerId,
startX:e.clientX,
startY:e.clientY,
x:e.clientX,
y:e.clientY,
velocity:null
};

previewAim(touch);
try{canvas.setPointerCapture(e.pointerId)}catch{}
});

canvas.addEventListener('pointermove',e=>{
if(!touch||screen!=='playing'||shot||e.pointerId!==touch.id)return;

touch.x=e.clientX;
touch.y=e.clientY;
previewAim(touch);
});

canvas.addEventListener('pointerup',e=>{
if(!touch||screen!=='playing'||locked||shot||e.pointerId!==touch.id)return;

const t=touch;
t.x=e.clientX;
t.y=e.clientY;

const v=velocity(
aimFromDrag(t.x-t.startX,t.y-t.startY),
THROW_SPEED
);

touch=null;
hideGuide();
launch(v);
});

canvas.addEventListener('pointercancel',()=>{
touch=null;
hideGuide();
});

/* LIVE PHYSICS */

function updateBall(dt){
if(!shot||shot.done)return;

acc+=dt;
let count=0;

while(acc>=DT&&count<32&&!shot.done){
step(shot,targetX(shot.phase+(shot.steps+1)*DT));
acc-=DT;
count++;

if(shot.contacts>shot.lastContact){
shot.lastContact=shot.contacts;
const e=shot.events[shot.events.length-1];

if(e?.type===B1)flash('#a7e8ff');
else if(e?.type===B2)flash('#ffe1a3');

beep(shot.lastImpact>1.5?420:320);
}
}

ball.position.copy(shot.p);
ball.rotation.x+=shot.v.z*dt*.45;
ball.rotation.z-=shot.v.x*dt*.45;

if(effectsOn){
trailPoints.push(ball.position.clone());
if(trailPoints.length>13)trailPoints.shift();

trail.geometry.dispose();
trail.geometry=new THREE.BufferGeometry().setFromPoints(trailPoints);
trail.visible=trailPoints.length>1;
}

if(shot.done)finish(shot.scored,shot.perfect);
}

function update(dt){
if(screen!=='playing')return;

if(shot&&!shot.done){
updateBall(dt);
target.position.x=targetX(shot.phase+shot.steps*DT);
}else if(!over){
if(!touch)targetPhase+=dt;
target.position.x=targetX(targetPhase);
}

if(mode==='challenge'&&!over){
goal();
const c=activeChallenge();

if(c?.[8]&&(performance.now()-challengeStart)/1000>=c[8]){
failChallenge('TIME UP!');
return;
}
}

if(flashTime>0){
flashTime=Math.max(0,flashTime-dt);
$('flash').style.opacity=String(flashTime/.15*.32);
}else{
$('flash').style.opacity='0';
}
}

/* CHALLENGES MENU */

function renderChallenges(){
const list=$('challengeList');
list.innerHTML='';

$('progress').textContent=
`Completed ${challenges.filter(c=>completed.includes(c[0])).length} / ${challenges.length} · Earn medals for bonus coins`;

for(const tier of ['Rookie','Skilled','Expert','Legend']){
const h=document.createElement('h3');
h.textContent=tier;
list.appendChild(h);

challenges.forEach((c,i)=>{
if(c[1]!==tier)return;

const unlocked=i===0||completed.includes(challenges[i-1][0]);
const done=completed.includes(c[0]);

const card=document.createElement('div');
card.className='item';

const name=document.createElement('strong');
name.textContent=(done?'✓ ':unlocked?'🎯 ':'🔒 ')+c[2];

const desc=document.createElement('p');
desc.textContent=c[3];

const reward=document.createElement('p');
reward.textContent=c[6]+' coins'+
(c[8]?' · '+c[8]+' seconds':'')+
(c[7]?' · Moving target':'');

const medal=document.createElement('div');
medal.style.fontSize='20px';
medal.textContent=medalIcon(medals[c[0]]||'none');

const btn=document.createElement('button');
btn.textContent=done?'REPLAY':unlocked?'START':'LOCKED';
btn.disabled=!unlocked;
btn.onclick=()=>startGame('challenge',c[0]);

card.append(name,desc,reward,medal,btn);
list.appendChild(card);
});
}
}

/* SHOP */

function renderShop(){
$('shopCoins').textContent='Coins: '+coins;

const list=$('skinList');
list.innerHTML='';

for(const s of skins){
const card=document.createElement('div');
card.className='item';

const preview=document.createElement('div');
preview.className='skinPreview';
preview.style.background=
`radial-gradient(circle at 30% 25%,white,${s[3]} 45%,${s[4]})`;

const title=document.createElement('strong');
title.textContent=s[1];

const price=document.createElement('p');
price.textContent=s[2]?s[2]+' coins':'Free';

const btn=document.createElement('button');

if(equipped===s[0]){
btn.textContent='EQUIPPED';
btn.disabled=true;
}else if(owned.includes(s[0])){
btn.textContent='EQUIP';
btn.onclick=()=>{
equipped=s[0];
updateSkin();
save();
renderShop();
};
}else{
btn.textContent='BUY — '+s[2]+' COINS';
btn.disabled=coins<s[2];
btn.onclick=()=>{
if(coins<s[2])return;
coins-=s[2];
owned.push(s[0]);
equipped=s[0];
updateSkin();
save();
renderShop();
};
}

card.append(preview,title,price,btn);
list.appendChild(card);
}
}

/* SETTINGS */

function renderSettings(){
$('soundToggle').textContent=soundOn?'ON':'OFF';
$('effectsToggle').textContent=effectsOn?'ON':'OFF';
$('guideToggle').textContent=guideOn?'ON':'OFF';
}

/* BUTTONS */

$('endlessBtn').onclick=()=>startGame('endless');
$('practiceBtn').onclick=()=>startGame('practice');
$('challengeBtn').onclick=()=>showScreen('challenges');
$('challengeBack').onclick=()=>showScreen('menu');
$('shopBtn').onclick=()=>showScreen('shop');
$('shopBack').onclick=()=>showScreen('menu');
$('settingsBtn').onclick=()=>showScreen('settings');
$('settingsBack').onclick=()=>showScreen('menu');

$('soundToggle').onclick=()=>{
soundOn=!soundOn;
save();
renderSettings();
};

$('effectsToggle').onclick=()=>{
effectsOn=!effectsOn;
save();
renderSettings();
};

$('guideToggle').onclick=()=>{
guideOn=!guideOn;
save();
renderSettings();
};

$('pause').onclick=()=>{
session++;
clearTimeout(finishTimer);
clearTimeout(messageTimer);
shot=null;
locked=false;
touch=null;
acc=0;
hideGuide();
showScreen('menu');
};

$('again').onclick=()=>{
if(mode==='challenge'&&completed.includes(challengeId)){
showScreen('challenges');
}else{
startGame(mode,challengeId);
}
};

/* START GAME */

const clock=new THREE.Clock();

function frame(){
requestAnimationFrame(frame);
update(Math.min(.04,clock.getDelta()));
renderer.render(scene,camera);
}

resetBall();
hud();
showScreen('menu');
$('loading').style.display='none';
frame();

</script>
</body>
